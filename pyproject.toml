[project]
name = "local-tools"
version = "0.1.1"
description = "Local-first utilities, with a Streamlit front end"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_tools"]
